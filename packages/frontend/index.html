<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuizCrowd for Fabric</title>
    <meta name="theme-color" content="#f3f1ff" />
    <script>
      (() => {
        let saved;
        try {
          saved = localStorage.getItem("quizcrowd-theme");
        } catch {
          document.documentElement.dataset.themeStorage = "unavailable";
        }
        let theme = saved === "dark" || saved === "light" ? saved : "light";
        if (saved !== "dark" && saved !== "light") {
          try {
            if (typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
          } catch {
            document.documentElement.dataset.themeMedia = "unavailable";
          }
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
