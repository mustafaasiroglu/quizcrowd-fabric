id: quizcrowd-fabric
name: QuizCrowd Fabric
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
  data:
    enabled: true
    dialect: mssql
    path: packages/data
    buildCommand: npm run build
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false
  functions:
    enabled: true
    path: rayfin/functions
    auth:
      type: application
    buildCommand: npm run build
  storage:
    enabled: false
secrets:
  - name: QUIZCROWD_SQL_SERVER
    description: Private writable Fabric SQL server FQDN
  - name: QUIZCROWD_SQL_DATABASE
    description: Private QuizCrowd application SQL database name
